<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canva 自動播放 + 音樂排程</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; }

  /* Canva iframe 容器 */
  .canva-wrapper {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    perspective: 1200px;
  }
  .canva-wrapper iframe {
    width: 100%; height: 100%;
    border: none; display: block;
    transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
    transform-origin: center center;
    will-change: opacity, transform, filter;
  }

  /* ===== 切換特效 ===== */
  /* 淡入淡出 */
  .fx-fade-out { opacity: 0; }
  .fx-fade-in  { opacity: 1; }

  /* 縮放淡入 */
  .fx-zoom-out { opacity: 0; transform: scale(0.85); filter: blur(6px); }
  .fx-zoom-in  { opacity: 1; transform: scale(1);    filter: blur(0); }

  /* 左右滑動 */
  .fx-slide-out { opacity: 0; transform: translateX(-80px); }
  .fx-slide-in  { opacity: 1; transform: translateX(0); }

  /* 3D 翻轉 */
  .fx-flip-out { opacity: 0; transform: rotateY(-90deg); }
  .fx-flip-in  { opacity: 1; transform: rotateY(0deg); }

  /* 旋轉淡入 */
  .fx-rotate-out { opacity: 0; transform: rotate(-12deg) scale(0.9); filter: blur(4px); }
  .fx-rotate-in  { opacity: 1; transform: rotate(0deg) scale(1);     filter: blur(0); }

  /* 模糊擴散 */
  .fx-blur-out { opacity: 0; filter: blur(24px) brightness(1.4); }
  .fx-blur-in  { opacity: 1; filter: blur(0) brightness(1); }

  /* 畫面閃光效果（疊加層） */
  .flash-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
    opacity: 0; pointer-events: none;
    z-index: 500;
    transition: opacity 0.4s ease;
  }
  .flash-overlay.active { opacity: 1; }

  /* 粒子效果容器 */
  .particles {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 400;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 10px #fff, 0 0 20px #4caf50;
  }
  @keyframes particleBurst {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* 啟用遮罩 */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; cursor: pointer;
    transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .box {
    text-align: center; color: #fff; padding: 40px 60px;
    border: 2px solid #fff; border-radius: 16px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(6px);
  }
  #overlay h1 { font-size: 28px; margin-bottom: 14px; }
  #overlay p { font-size: 16px; opacity: 0.85; line-height: 1.6; }
  #overlay .btn {
    margin-top: 22px; padding: 12px 36px;
    background: #4caf50; border: none; border-radius: 8px;
    color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
    transition: background 0.2s;
  }
  #overlay .btn:hover { background: #45a049; }

  /* 控制面板 */
  #panel {
    position: fixed; right: 16px; bottom: 16px;
    width: 240px;
    background: rgba(20, 20, 20, 0.88);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    transition: transform 0.3s, opacity 0.3s, width 0.3s, height 0.3s, padding 0.3s;
    overflow: hidden;
  }
  #panel.collapsed {
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  #panel.collapsed .header {
    margin: 0; padding: 0; border: none;
    width: 100%; height: 100%;
    justify-content: center;
  }
  #panel.collapsed .header .title { display: none; }
  #panel.collapsed .header .toggle { font-size: 20px; opacity: 1; }
  #panel.collapsed .body { display: none; }
  #panel .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; user-select: none;
  }
  #panel .header .title { font-weight: bold; font-size: 13px; }
  #panel .header .toggle { font-size: 14px; opacity: 0.7; }
  #panel .row { margin: 6px 0; display: flex; justify-content: space-between; align-items: center; }
  #panel .label { opacity: 0.7; }
  #panel .value { font-weight: bold; font-variant-numeric: tabular-nums; }
  #panel .status-playing { color: #4caf50; }
  #panel .status-idle { color: #9e9e9e; }
  #panel .next { color: #ffc107; font-size: 12px; }
  #panel .volume-row { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
  #panel .volume-row input[type=range] {
    flex: 1; margin: 0 6px; accent-color: #4caf50;
  }
  #panel .vol-val { min-width: 36px; text-align: right; }
</style>
</head>
<body>

<!-- Canva 簡報嵌入（使用 watch 端點 + autoplay + timer 參數強制自動輪播 5 秒） -->
<div class="canva-wrapper">
  <iframe
    id="canvaFrame"
    src="https://www.canva.com/design/DAHINop9Qvg/1dv4RlbZUFhmdYe3TQ-yTg/watch?embed&autoplay=yes&timer=5"
    allowfullscreen="allowfullscreen"
    allow="fullscreen; autoplay">
  </iframe>
</div>

<!-- 音訊元素 -->
<audio id="bgm" src="CLAP3.mp3" loop preload="auto"></audio>

<!-- 控制面板 -->
<div id="panel">
  <div class="header" id="panelHeader">
    <span class="title">🎵 音樂排程</span>
    <span class="toggle" id="toggleBtn">▼</span>
  </div>
  <div class="body" id="panelBody">
  <div class="row">
    <span class="label">目前時間</span>
    <span class="value" id="clock">--:--:--</span>
  </div>
  <div class="row">
    <span class="label">狀態</span>
    <span class="value status-idle" id="status">🔇 待機</span>
  </div>
  <div class="row">
    <span class="label">下一時段</span>
    <span class="next" id="nextSlot">--</span>
  </div>
  <div class="row volume-row">
    <span class="label">🔊</span>
    <input type="range" id="volume" min="0" max="100" value="25">
    <span class="vol-val" id="volVal">25%</span>
  </div>
  <div class="row" style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1); flex-direction:column; align-items:stretch;">
    <span class="label" style="margin-bottom:6px;">Canva 輪播模式</span>
    <select id="modeSelect" style="background:#333; color:#fff; border:1px solid #555; border-radius:4px; padding:4px; font-size:12px;">
      <option value="watch">模式 1：watch 自動播放（預設）</option>
      <option value="view">模式 2：view embed（手動）</option>
      <option value="force" id="modeForceOption">模式 3：強制自動換頁</option>
    </select>
    <span class="label" style="margin:8px 0 6px;">切換特效（模式 3 專用）</span>
    <select id="fxSelect" style="background:#333; color:#fff; border:1px solid #555; border-radius:4px; padding:4px; font-size:12px;">
      <option value="random">🎲 隨機特效</option>
      <option value="fade">✨ 淡入淡出</option>
      <option value="zoom">🔍 縮放模糊</option>
      <option value="slide">➡️ 左右滑動</option>
      <option value="flip">🔄 3D 翻轉</option>
      <option value="rotate">🌀 旋轉淡入</option>
      <option value="blur">💫 模糊擴散</option>
      <option value="flash">⚡ 閃光 + 粒子</option>
    </select>
    <label style="margin-top:6px; display:flex; align-items:center; gap:6px; font-size:12px; opacity:0.85;">
      <input type="checkbox" id="particleToggle" checked>
      <span>啟用粒子特效</span>
    </label>
    <button id="reloadBtn" style="margin-top:8px; background:#2196f3; color:#fff; border:none; border-radius:4px; padding:6px; font-size:12px; cursor:pointer;">套用並重載 Canva</button>
  </div>
  </div>
</div>

<!-- 特效層 -->
<div class="flash-overlay" id="flashOverlay"></div>
<div class="particles" id="particles"></div>

<!-- 啟用遮罩 -->
<div id="overlay">
  <div class="box">
    <h1>🎬 Canva 簡報 + 音樂排程</h1>
    <p>
      點擊下方按鈕以啟用自動播放功能。<br>
      音樂將依排定時間自動播放。
    </p>
    <button class="btn" id="startBtn">點擊啟用</button>
  </div>
</div>

<script>
  // ============================================
  // ⚙️ 使用者可調整設定區
  // ============================================

  // 🔢 Canva 簡報總頁數（播完會自動循環回第 1 頁）
  const TOTAL_PAGES = 9;

  // ⏱ 模式 3 每頁停留秒數
  const SLIDE_INTERVAL_MS = 8000;

  // 🔊 初始音量（0~100）
  const INITIAL_VOLUME = 25;

  // 🎵 音樂排程表（每段時間內循環播放 CLAP3.mp3）
  const schedule = [
    { start: "08:10", end: "08:20" },
    { start: "09:05", end: "09:15" },
    { start: "10:00", end: "10:10" },
    { start: "10:55", end: "11:05" },
    { start: "11:50", end: "11:55" },
    { start: "12:15", end: "12:30" },
    { start: "13:50", end: "14:00" },
    { start: "14:45", end: "14:55" },
    { start: "15:40", end: "15:55" }
  ];

  // ============================================

  // ============ DOM 參考 ============
  const audio     = document.getElementById("bgm");
  const overlay   = document.getElementById("overlay");
  const startBtn  = document.getElementById("startBtn");
  const clockEl   = document.getElementById("clock");
  const statusEl  = document.getElementById("status");
  const nextEl    = document.getElementById("nextSlot");
  const volSlider = document.getElementById("volume");
  const volVal    = document.getElementById("volVal");
  const panel     = document.getElementById("panel");
  const panelHdr  = document.getElementById("panelHeader");
  const toggleBtn = document.getElementById("toggleBtn");

  // ============ 初始音量 ============
  audio.volume = INITIAL_VOLUME / 100;
  volSlider.value = INITIAL_VOLUME;
  volVal.textContent = INITIAL_VOLUME + "%";
  volSlider.addEventListener("input", () => {
    const v = parseInt(volSlider.value, 10);
    audio.volume = v / 100;
    volVal.textContent = v + "%";
  });

  // ============ 啟用按鈕 ============
  let activated = false;
  startBtn.addEventListener("click", async () => {
    try {
      // 嘗試播放後立即暫停，以解鎖音訊
      await audio.play();
      audio.pause();
      audio.currentTime = 0;
    } catch (e) {
      console.warn("音訊解鎖失敗:", e);
    }
    activated = true;
    overlay.classList.add("hidden");
    setTimeout(() => overlay.style.display = "none", 400);
  });

  // ============ 摺疊面板 ============
  panelHdr.addEventListener("click", () => {
    panel.classList.toggle("collapsed");
    toggleBtn.textContent = panel.classList.contains("collapsed") ? "🎵" : "▼";
  });

  // ============ 工具函式 ============
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function getNowHM() {
    const d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function getNowHMS() {
    const d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  // 當前時間是否在某個時段內 (start <= now < end)
  function inSlot(nowHM, slot) {
    return nowHM >= slot.start && nowHM < slot.end;
  }

  // 找到目前所屬時段，找不到回傳 null
  function currentSlot(nowHM) {
    for (const s of schedule) {
      if (inSlot(nowHM, s)) return s;
    }
    return null;
  }

  // 找下一個未來時段
  function nextSlot(nowHM) {
    for (const s of schedule) {
      if (nowHM < s.start) return s;
    }
    return null; // 今日已無
  }

  // ============ 主循環（每秒檢查） ============
  function tick() {
    const nowHM  = getNowHM();
    const nowHMS = getNowHMS();

    clockEl.textContent = nowHMS;

    // 尋找當前時段
    const cur = currentSlot(nowHM);

    if (activated) {
      if (cur) {
        // 在時段內
        if (audio.paused) {
          audio.play().catch(err => console.warn("播放失敗:", err));
        }
        statusEl.textContent = "🔊 播放中";
        statusEl.className = "value status-playing";
        nextEl.textContent = cur.start + " ~ " + cur.end + "（進行中）";
      } else {
        // 不在任何時段內
        if (!audio.paused) {
          audio.pause();
          audio.currentTime = 0;
        }
        statusEl.textContent = "🔇 待機";
        statusEl.className = "value status-idle";

        const nxt = nextSlot(nowHM);
        nextEl.textContent = nxt ? (nxt.start + " ~ " + nxt.end) : "今日排程已結束";
      }
    } else {
      // 尚未啟用
      statusEl.textContent = "⏸ 未啟用";
      statusEl.className = "value status-idle";
      const nxt = nextSlot(nowHM) || (cur ? cur : null);
      nextEl.textContent = cur
        ? (cur.start + " ~ " + cur.end + "（進行中）")
        : (nxt ? (nxt.start + " ~ " + nxt.end) : "今日排程已結束");
    }
  }

  // 立即執行一次，並每秒執行
  tick();
  setInterval(tick, 1000);

  // ============ Canva 輪播模式切換 ============
  const canvaFrame   = document.getElementById("canvaFrame");
  const modeSelect   = document.getElementById("modeSelect");
  const fxSelect     = document.getElementById("fxSelect");
  const reloadBtn    = document.getElementById("reloadBtn");
  const particleTgl  = document.getElementById("particleToggle");
  const flashOverlay = document.getElementById("flashOverlay");
  const particleBox  = document.getElementById("particles");
  const DESIGN_BASE  = "https://www.canva.com/design/DAHINop9Qvg/1dv4RlbZUFhmdYe3TQ-yTg";

  let forceInterval = null;
  let currentPage   = 1;

  // 所有特效清單（用於隨機）
  const ALL_FX = ["fade", "zoom", "slide", "flip", "rotate", "blur", "flash"];

  // 粒子爆發效果
  function burstParticles(count = 30) {
    if (!particleTgl.checked) return;
    const colors = ["#fff", "#4caf50", "#2196f3", "#ffc107", "#e91e63", "#9c27b0"];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      const angle = Math.random() * Math.PI * 2;
      const dist  = 150 + Math.random() * 300;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const size = 4 + Math.random() * 8;
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = cx + "px";
      p.style.top  = cy + "px";
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.background = color;
      p.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
      p.style.setProperty("--dx", dx + "px");
      p.style.setProperty("--dy", dy + "px");
      p.style.animation = `particleBurst ${0.8 + Math.random() * 0.6}s ease-out forwards`;
      particleBox.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  }

  // 閃光效果
  function flashScreen() {
    flashOverlay.classList.add("active");
    setTimeout(() => flashOverlay.classList.remove("active"), 400);
  }

  // 清除所有特效 class
  function clearFxClasses() {
    const classes = [
      "fx-fade-out", "fx-fade-in",
      "fx-zoom-out", "fx-zoom-in",
      "fx-slide-out", "fx-slide-in",
      "fx-flip-out", "fx-flip-in",
      "fx-rotate-out", "fx-rotate-in",
      "fx-blur-out", "fx-blur-in"
    ];
    classes.forEach(c => canvaFrame.classList.remove(c));
  }

  // 執行切換特效並重載 iframe
  function playTransition(newSrc) {
    let fx = fxSelect.value;
    if (fx === "random") {
      fx = ALL_FX[Math.floor(Math.random() * ALL_FX.length)];
    }

    clearFxClasses();

    // 先做「離開」動畫
    if (fx === "fade")   canvaFrame.classList.add("fx-fade-out");
    if (fx === "zoom")   canvaFrame.classList.add("fx-zoom-out");
    if (fx === "slide")  canvaFrame.classList.add("fx-slide-out");
    if (fx === "flip")   canvaFrame.classList.add("fx-flip-out");
    if (fx === "rotate") canvaFrame.classList.add("fx-rotate-out");
    if (fx === "blur")   canvaFrame.classList.add("fx-blur-out");
    if (fx === "flash") {
      canvaFrame.classList.add("fx-fade-out");
      flashScreen();
      burstParticles(50);
    }

    // 動畫中途重載 iframe
    setTimeout(() => {
      canvaFrame.src = newSrc;

      // 切換到「進入」動畫
      clearFxClasses();
      if (fx === "fade")   canvaFrame.classList.add("fx-fade-in");
      if (fx === "zoom")   canvaFrame.classList.add("fx-zoom-in");
      if (fx === "slide")  canvaFrame.classList.add("fx-slide-in");
      if (fx === "flip")   canvaFrame.classList.add("fx-flip-in");
      if (fx === "rotate") canvaFrame.classList.add("fx-rotate-in");
      if (fx === "blur")   canvaFrame.classList.add("fx-blur-in");
      if (fx === "flash")  canvaFrame.classList.add("fx-fade-in");

      // 部分特效搭配額外粒子
      if (fx !== "flash" && particleTgl.checked && Math.random() > 0.4) {
        burstParticles(15);
      }
    }, 500);
  }

  function applyMode(mode) {
    // 清除舊的強制輪播計時器
    if (forceInterval) {
      clearInterval(forceInterval);
      forceInterval = null;
    }
    clearFxClasses();
    canvaFrame.style.opacity = "1";
    canvaFrame.style.transform = "";
    canvaFrame.style.filter = "";

    if (mode === "watch") {
      // 模式 1：Canva watch 端點自動播放 + 5 秒計時
      canvaFrame.src = DESIGN_BASE + "/watch?embed&autoplay=yes&timer=5";
    } else if (mode === "view") {
      // 模式 2：傳統 view embed（需手動）
      canvaFrame.src = DESIGN_BASE + "/view?embed";
    } else if (mode === "force") {
      // 模式 3：強制每 N 秒重載 iframe 切換到下一頁 + 切換特效
      currentPage = 1;
      canvaFrame.src = DESIGN_BASE + "/view?embed#" + currentPage;
      forceInterval = setInterval(() => {
        currentPage++;
        // 超過總頁數 → 循環回第 1 頁
        if (currentPage > TOTAL_PAGES) currentPage = 1;
        const newSrc = DESIGN_BASE + "/view?embed#" + currentPage;
        playTransition(newSrc);
      }, SLIDE_INTERVAL_MS);
    }
  }

  reloadBtn.addEventListener("click", () => {
    applyMode(modeSelect.value);
  });

  // 依設定動態更新模式 3 選項文字
  const modeForceOption = document.getElementById("modeForceOption");
  if (modeForceOption) {
    modeForceOption.textContent = `模式 3：強制每 ${SLIDE_INTERVAL_MS / 1000} 秒重載換頁`;
  }
</script>
</body>
</html>
